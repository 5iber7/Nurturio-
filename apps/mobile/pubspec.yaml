name: nurturio
description: Learn by growing. Discover by doing.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: 1.38.2
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  drift: 2.35.2
  drift_flutter: 0.3.1
  path_provider: 2.1.6
  flutter_secure_storage: 11.2.0
  supabase_flutter: 2.18.0
  image_picker: 1.2.4
  image: 4.10.1
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  flutter_tts: 4.2.5
  uuid: 4.6.0
  crypto: 3.0.7
  intl: 0.20.3
  audioplayers: 6.8.1
  video_player: 2.14.1
  model_viewer_plus:
    path: ../../third_party/model_viewer_plus
  webview_flutter: 4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  http: 1.6.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/audio/
    - assets/models/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
